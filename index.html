<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Hábitos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0a">
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#141414;
    --card:#1a1a1a;
    --border:#2a2a2a;
    --gold:#c9a96e;
    --gold-dim:#8a744c;
    --text:#f0f0ea;
    --text-dim:#8a8a85;
    --danger:#b5544a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  body{
    padding: calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 100px);
  }
  h1{
    font-size:13px; font-weight:700; letter-spacing:0.25em; text-transform:uppercase;
    color:var(--gold); margin:0 0 4px;
  }
  .date{
    font-size:22px; font-weight:300; letter-spacing:0.01em; margin:0 0 4px; text-transform:capitalize;
  }
  .summary{
    font-size:13px; color:var(--text-dim); margin:0 0 28px; letter-spacing:0.02em;
  }
  .summary b{ color:var(--gold); font-weight:600; }

  .habit{
    background:var(--card); border:1px solid var(--border); border-radius:2px;
    padding:16px 16px 14px; margin-bottom:12px; position:relative;
  }
  .habit-top{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;
  }
  .habit-name{
    font-size:15px; letter-spacing:0.03em; font-weight:500;
  }
  .habit-streak{
    font-size:11px; color:var(--gold-dim); letter-spacing:0.08em; text-transform:uppercase; white-space:nowrap;
  }
  .habit-streak b{ color:var(--gold); font-weight:700; font-size:12px; }

  .check-btn{
    width:44px; height:44px; border-radius:50%; border:1.5px solid var(--border);
    background:transparent; flex-shrink:0; margin-left:12px;
    display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .check-btn svg{ width:20px; height:20px; opacity:0; transition:opacity .15s ease; }
  .check-btn.done{ background:var(--gold); border-color:var(--gold); }
  .check-btn.done svg{ opacity:1; }
  .check-btn.done svg path{ stroke:#0a0a0a; }
  .check-btn svg path{ stroke:var(--gold); }

  .week{
    display:flex; gap:6px; justify-content:space-between;
  }
  .day{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:5px;
  }
  .day-label{ font-size:9px; color:var(--text-dim); letter-spacing:0.05em; text-transform:uppercase; }
  .day-dot{
    width:100%; aspect-ratio:1; max-width:32px; border-radius:50%;
    border:1px solid var(--border); background:transparent;
  }
  .day-dot.filled{ background:var(--gold-dim); border-color:var(--gold-dim); }
  .day-dot.today{ border-color:var(--gold); border-width:1.5px; }
  .day-dot.today.filled{ background:var(--gold); }

  .row-actions{
    display:flex; justify-content:flex-end; margin-top:10px; gap:16px;
  }
  .link-btn{
    background:none; border:none; color:var(--text-dim); font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase; padding:4px 0;
  }
  .link-btn.danger{ color:var(--danger); opacity:0.7; }

  .add-btn{
    width:100%; padding:16px; margin-top:8px; background:transparent;
    border:1px dashed var(--border); color:var(--text-dim);
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase; border-radius:2px;
  }
  .add-btn:active{ border-color:var(--gold-dim); color:var(--gold); }

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty div{ font-size:13px; letter-spacing:0.05em; line-height:1.6; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.7);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:10;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--bg2); border-top:1px solid var(--border);
    width:100%; max-width:480px; padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(20px); transition:transform .2s ease;
  }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet h2{
    font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);
    margin:0 0 16px; font-weight:700;
  }
  .sheet input{
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    font-size:15px; padding:14px; border-radius:2px; margin-bottom:14px;
  }
  .sheet input:focus{ outline:none; border-color:var(--gold-dim); }
  .sheet-actions{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:14px; border-radius:2px; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase; border:1px solid var(--border); background:transparent; color:var(--text-dim);
  }
  .btn.primary{ background:var(--gold); border-color:var(--gold); color:#0a0a0a; font-weight:700; }
</style>
</head>
<body>

  <h1>Hábitos</h1>
  <div class="date" id="today-label"></div>
  <div class="summary" id="summary"></div>

  <div id="list"></div>

  <button class="add-btn" id="add-habit-btn">+ Nuevo hábito</button>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2 id="sheet-title">Nuevo hábito</h2>
      <input type="text" id="habit-input" placeholder="Ej: Tomar agua, Leer, Gimnasio" maxlength="40">
      <div class="sheet-actions">
        <button class="btn" id="cancel-btn">Cancelar</button>
        <button class="btn primary" id="save-btn">Guardar</button>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
