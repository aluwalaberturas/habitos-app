<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Hábitos</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0a">
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#141414;
    --card:#17171a;
    --card2:#1d1d21;
    --border:#28282c;
    --gold:#d4b483;
    --gold-bright:#e8c88f;
    --gold-dim:#8a744c;
    --text:#f4f3ef;
    --text-dim:#8d8d92;
    --danger:#c9756a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    overscroll-behavior-y:none;
  }
  body{
    padding: calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 100px);
    background:
      radial-gradient(circle at 15% 0%, rgba(212,180,131,0.07), transparent 45%),
      var(--bg);
  }
  h1{
    font-size:12px; font-weight:700; letter-spacing:0.28em; text-transform:uppercase;
    color:var(--gold); margin:0 0 10px;
  }
  .top-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-bottom:18px;
  }
  .top-left{ flex:1; min-width:0; }
  .date{
    font-size:21px; font-weight:600; letter-spacing:0.01em; text-transform:capitalize;
  }
  .date-nav{
    display:flex; align-items:center; gap:10px; margin-bottom:2px;
  }
  .date-center{ flex:1; min-width:0; }
  .nav-arrow{
    width:34px; height:34px; flex-shrink:0; border-radius:50%; border:1px solid var(--border);
    background:var(--card); color:var(--gold); font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease;
  }
  .nav-arrow:active{ transform:scale(0.9); }
  .nav-arrow:disabled{ opacity:0.25; }
  .today-jump{
    background:none; border:none; color:var(--gold-dim); font-size:11px;
    letter-spacing:0.08em; text-transform:uppercase; padding:2px 0; margin-top:3px;
  }
  .ring-wrap{
    position:relative; width:64px; height:64px; flex-shrink:0;
  }
  .ring-svg{ width:64px; height:64px; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--border); stroke-width:5; }
  .ring-fg{
    fill:none; stroke:var(--gold); stroke-width:5; stroke-linecap:round;
    transition:stroke-dashoffset .4s ease;
  }
  .ring-text{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:var(--gold);
  }
  .summary{
    font-size:12.5px; color:var(--text-dim); margin:0 0 22px; letter-spacing:0.01em;
  }
  .summary b{ color:var(--gold); font-weight:600; }

  .quote{
    font-size:13px; font-style:italic; color:var(--text-dim);
    background:linear-gradient(160deg, var(--card2), var(--card));
    border:1px solid var(--border); border-radius:16px;
    padding:12px 16px; margin:0 0 16px; line-height:1.45;
    box-shadow:0 6px 18px rgba(0,0,0,0.22);
  }
  .quote span{ color:var(--gold); font-style:normal; font-weight:700; }

  .habit{
    background:linear-gradient(160deg, var(--card2), var(--card));
    border:1px solid var(--border); border-radius:20px;
    padding:16px 16px 14px; margin-bottom:12px; position:relative;
    box-shadow:0 6px 18px rgba(0,0,0,0.28);
  }
  .habit.complete{
    border-color:rgba(212,180,131,0.5);
    box-shadow:0 6px 18px rgba(0,0,0,0.28), 0 0 0 1px rgba(212,180,131,0.15) inset;
  }
  .habit-top{
    display:flex; align-items:center; gap:12px; margin-bottom:10px;
  }
  .habit-icon{
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    background:rgba(212,180,131,0.1);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
  }
  .habit-name{
    font-size:14.5px; letter-spacing:0.01em; font-weight:500; flex:1; min-width:0;
    line-height:1.3;
  }
  .habit-foot{
    display:flex; align-items:center; gap:8px; margin-top:2px; flex-wrap:wrap;
  }
  .streak-badge{
    font-size:11px; color:var(--text-dim); background:rgba(255,255,255,0.04);
    border-radius:20px; padding:4px 10px; white-space:nowrap;
  }
  .streak-badge b{ color:var(--gold); font-weight:700; }
  .foot-spacer{ flex:1; }
  .chip-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase;
    padding:6px 12px; border-radius:20px;
  }
  .chip-btn:active{ border-color:var(--gold-dim); color:var(--gold); }

  .check-btn{
    width:42px; height:42px; border-radius:50%; border:1.5px solid var(--border);
    background:var(--bg2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:all .18s cubic-bezier(.34,1.56,.64,1);
  }
  .check-btn:active{ transform:scale(0.88); }
  .check-btn svg{ width:19px; height:19px; opacity:0; transition:opacity .15s ease; }
  .check-btn.done{ background:linear-gradient(160deg, var(--gold-bright), var(--gold)); border-color:var(--gold); }
  .check-btn.done svg{ opacity:1; }
  .check-btn.done svg path{ stroke:#161311; }
  .check-btn svg path{ stroke:var(--gold); }

  .year-scroll{
    overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; margin:10px -2px 0;
  }
  .year-months{
    position:relative; height:14px; margin-bottom:2px;
  }
  .year-month-label{
    position:absolute; top:0; font-size:9px; color:var(--text-dim);
    letter-spacing:0.03em; text-transform:uppercase; white-space:nowrap;
  }
  .year-grid{
    display:flex; gap:3px;
  }
  .year-week{
    display:flex; flex-direction:column; gap:3px;
  }
  .year-day{
    width:12px; height:12px; border-radius:3px;
    background:var(--border); flex-shrink:0;
  }
  .year-day.pad{ background:transparent; }
  .year-day.future{ background:transparent; border:1px solid var(--border); opacity:0.5; }
  .year-day.pretrack{ background:transparent; border:1px solid var(--border); opacity:0.25; }
  .year-day.filled{ background:var(--gold-dim); }
  .year-day.today{ box-shadow:0 0 0 1.5px var(--gold); }
  .year-day.today.filled{ background:var(--gold); }

  .add-btn{
    width:100%; padding:16px; margin-top:8px; background:var(--card);
    border:1px dashed var(--border); color:var(--text-dim);
    font-size:12px; letter-spacing:0.1em; text-transform:uppercase; border-radius:18px;
  }
  .add-btn:active{ border-color:var(--gold-dim); color:var(--gold); }

  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim);
  }
  .empty div{ font-size:13px; letter-spacing:0.05em; line-height:1.6; }

  /* cups (counter habits) */
  .cups-row{
    display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 2px 50px;
  }
  .cup-btn{ background:none; border:none; padding:0; line-height:0; transition:transform .12s ease; }
  .cup-btn:active{ transform:scale(0.85); }
  .cup-btn svg path{ transition:fill .15s ease, stroke .15s ease; }
  .counter-label{
    font-size:11px; color:var(--text-dim); margin:8px 0 0 50px;
  }
  .counter-label b{ color:var(--gold); font-size:13px; }

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.7);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:10;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--bg2); border-top:1px solid var(--border);
    border-radius:20px 20px 0 0;
    width:100%; max-width:480px; padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(20px); transition:transform .2s ease;
  }
  .overlay.open .sheet{ transform:translateY(0); }
  .sheet h2{
    font-size:12px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold);
    margin:0 0 16px; font-weight:700;
  }
  .sheet input{
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    font-size:15px; padding:14px; border-radius:14px; margin-bottom:14px;
  }
  .sheet input:focus{ outline:none; border-color:var(--gold-dim); }
  .sheet-actions{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:14px; border-radius:14px; font-size:12px; letter-spacing:0.1em;
    text-transform:uppercase; border:1px solid var(--border); background:transparent; color:var(--text-dim);
  }
  .btn.primary{ background:linear-gradient(160deg, var(--gold-bright), var(--gold)); border-color:var(--gold); color:#161311; font-weight:700; }

  .counter-toggle{
    display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-dim);
    margin:-4px 0 14px; letter-spacing:0.01em;
  }
  .counter-toggle input{ width:16px; height:16px; accent-color:var(--gold); }
</style>
</head>
<body>

  <h1>Hábitos</h1>
  <div class="quote" id="quote"></div>
  <div class="top-card">
    <div class="top-left">
      <div class="date-nav">
        <button class="nav-arrow" id="prev-day">‹</button>
        <div class="date-center">
          <div class="date" id="today-label"></div>
          <button class="today-jump" id="today-jump" style="display:none">Volver a hoy</button>
        </div>
        <button class="nav-arrow" id="next-day">›</button>
      </div>
    </div>
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 64 64">
        <circle class="ring-bg" cx="32" cy="32" r="27"></circle>
        <circle class="ring-fg" id="ring-fg" cx="32" cy="32" r="27"></circle>
      </svg>
      <div class="ring-text" id="ring-text">0%</div>
    </div>
  </div>
  <div class="summary" id="summary"></div>

  <div id="list"></div>

  <button class="add-btn" id="add-habit-btn">+ Nuevo hábito</button>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2 id="sheet-title">Nuevo hábito</h2>
      <input type="text" id="habit-input" placeholder="Ej: Tomar agua, Leer, Gimnasio" maxlength="40">
      <label class="counter-toggle">
        <input type="checkbox" id="habit-counter-toggle"> Contar unidades (ej: vasos de agua)
      </label>
      <input type="number" id="habit-target-input" placeholder="Meta por día (ej: 12)" min="1" style="display:none">
      <div class="sheet-actions">
        <button class="btn" id="cancel-btn">Cancelar</button>
        <button class="btn primary" id="save-btn">Guardar</button>
      </div>
    </div>
  </div>

<script src="app.js"></script>
</body>
</html>
